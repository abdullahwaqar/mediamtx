<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgb(30, 30, 30);
    }

    #message {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      text-align: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: white;
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
      text-shadow: 0 0 5px black;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      width: auto;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 14px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      z-index: 3;
      text-align: left;
    }

    /* HUD Container */
    .hud-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }

    /* HUD Boxes */
    .hud-box {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      min-width: 200px;
      box-sizing: border-box;
      text-shadow: 0 0 5px black;
    }

    .hud-box h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      border-bottom: 1px solid #555;
      padding-bottom: 5px;
    }

    .hud-box p {
      margin: 5px 0;
      font-size: 14px;
    }

    /* Marker Graph HUD Box */
    #marker-graph-hud {
      width: 440px;
    }

    #marker-graph {
      width: 400px;
      height: 400px;
      background-color: #2e2e2e;
      border: 1px solid #555;
      border-radius: 4px;
    }

    /* Responsive Canvas */
    @media (max-width: 800px) {
      #marker-graph-hud {
        width: 320px;
      }

      #marker-graph {
        width: 300px;
        height: 300px;
      }
    }

    #network-stats {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 9999;
      background: #2e2e2e;
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      min-width: 220px;
    }
  </style>
  <script defer src="./analytic.js"></script>
  <script defer src="./reader.js"></script>
  <script defer src="./raw_datachannel_reader.js"></script>
</head>

<body>

  <video id="video"></video>
  <div id="message"></div>

  <div id="status"></div>

  <!-- HUD Container -->
  <div class="hud-container">
    <!-- Attitude HUD Box -->
    <div class="hud-box" id="attitude-hud">
      <h3>Attitude</h3>
      <p>Yaw: <span id="yaw">0.000</span>°</p>
      <p>Pitch: <span id="pitch">0.000</span>°</p>
      <p>Roll: <span id="roll">0.000</span>°</p>
    </div>

    <!-- Add this to your HUD section -->
    <div class="hud-box" id="network-stats">
      <h3>Network Metrics</h3>
      <p>Video Bitrate: <span id="video-bitrate">0.00</span> kbps</p>
      <p>Jitter: <span id="jitter">0.00</span> ms</p>
      <p>Packet Loss: <span id="packet-loss">0.00</span>%</p>
      <p>RTT: <span id="rtt">0.00</span> ms</p>
      <p>Available Bandwidth: <span id="bandwidth">0.00</span> kbps</p>
      <p>Framerate: <span id="framerate">0</span> fps</p>
    </div>

    <!-- Marker HUD Box -->
    <div class="hud-box" id="marker-hud">
      <h3>Marker</h3>
      <p>ID: <span id="marker-id">N/A</span></p>
      <p>Angle X: <span id="angle-x">0.000</span>°</p>
      <p>Angle Y: <span id="angle-y">0.000</span>°</p>
      <p>Distance: <span id="distance">0.000</span>m</p>
    </div>

    <!-- Marker Graph HUD Box -->
    <div class="hud-box" id="marker-graph-hud">
      <h3>Marker Graph</h3>
      <canvas id="marker-graph" width="400" height="400"></canvas>
    </div>
  </div>

  <script>

    const video = document.getElementById('video');
    const message = document.getElementById('message');
    let defaultControls = false;

    const setMessage = (str) => {
      if (str !== '') {
        video.controls = false;
      } else {
        video.controls = defaultControls;
      }
      message.innerText = str;
    };

    const parseBoolString = (str, defaultVal) => {
      str = (str || '');

      if (['1', 'yes', 'true'].includes(str.toLowerCase())) {
        return true;
      }
      if (['0', 'no', 'false'].includes(str.toLowerCase())) {
        return false;
      }
      return defaultVal;
    };

    const loadAttributesFromQuery = () => {
      const params = new URLSearchParams(window.location.search);
      video.controls = parseBoolString(params.get('controls'), true);
      video.muted = parseBoolString(params.get('muted'), true);
      video.autoplay = parseBoolString(params.get('autoplay'), true);
      video.playsInline = parseBoolString(params.get('playsinline'), true);
      defaultControls = video.controls;
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadAttributesFromQuery();

      new MediaMTXWebRTCReader({
        url: new URL('whep', window.location.href) + window.location.search,
        onError: (err) => {
          setMessage(err);
        },
        onTrack: (evt) => {
          setMessage('');
          video.srcObject = evt.streams[0];
        },
        onConnectionEstablished: (ref) => {
          new ConnectionAnalytic(ref).start();
        }
      });

    });

  </script>

</body>

</html>
